<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <!--
      GitHub Pages SPA 라우팅 핵크:
      GitHub Pages는 존재하지 않는 경로에 대해 이 404.html을 보여줌.
      이 스크립트가 현재 경로를 쿼리 파라미터로 변환하여 index.html로 리다이렉트함.
      예: /cloud9medicare/admin-send → /cloud9medicare/?/admin-send
      그 후 index.html의 스크립트가 원래 경로를 복원함.
    -->
    <script>
      // 현재 경로에서 base path를 제거하고 쿼리 파라미터로 전달
      var pathSegmentsToKeep = 1; // '/cloud9medicare/' → 1 segment
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
