<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0f6b58">
<title>병원동행 배정 도우미</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: single phone-first column, three sequential step panels, dispatch log below */
:root{
  --bg:#f3f5f4; --panel:#ffffff; --ink:#15211d; --muted:#5d6b66; --line:#dbe2df;
  --accent:#0f6b58; --accent-ink:#ffffff; --accent-soft:#e2f0ec;
  --kakao:#fee500; --kakao-ink:#191600;
  --ok:#1d7a3f; --ok-soft:#e3f3e8; --warn:#9a5b00; --warn-soft:#fbf0dc; --bad:#b3261e; --bad-soft:#fbe5e3;
  --font:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --panel:#17201d; --ink:#e6edea; --muted:#95a39e; --line:#2a3632;
  --accent:#4cc3a5; --accent-ink:#06231c; --accent-soft:#1a3029;
  --kakao:#fee500; --kakao-ink:#191600;
  --ok:#6fd48f; --ok-soft:#173222; --warn:#f0b35a; --warn-soft:#33270f; --bad:#ff8a80; --bad-soft:#3a1916; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --panel:#17201d; --ink:#e6edea; --muted:#95a39e; --line:#2a3632;
  --accent:#4cc3a5; --accent-ink:#06231c; --accent-soft:#1a3029;
  --kakao:#fee500; --kakao-ink:#191600;
  --ok:#6fd48f; --ok-soft:#173222; --warn:#f0b35a; --warn-soft:#33270f; --bad:#ff8a80; --bad-soft:#3a1916; color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;padding:0 16px}
.wrap{max-width:640px;margin:0 auto;padding-block:20px 48px;display:flex;flex-direction:column;gap:14px}
header h1{font-size:21px;margin:0;text-wrap:balance;letter-spacing:-.01em}
header p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.step{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.step-h{display:flex;align-items:center;gap:10px}
.num{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.step-h h2{font-size:16px;margin:0}
.step-h .hint{margin-left:auto;font-size:12px;color:var(--muted)}
textarea,input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{resize:vertical;min-height:84px}
textarea.msg{min-height:190px;font-size:14px;background:var(--panel)}
textarea:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid .full{grid-column:1/-1}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);letter-spacing:.02em;min-width:0}
label input{font-size:14.5px}
input.missing{border-color:var(--warn);background:var(--warn-soft)}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-weight:600;border-radius:10px;padding:11px 14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.kakao{background:var(--kakao);border-color:var(--kakao);color:var(--kakao-ink)}
button:disabled{opacity:.45;cursor:not-allowed}
.grow{flex:1}
.tabs{display:flex;gap:6px}
.tabs button{padding:7px 12px;font-size:13px;font-weight:500}
.tabs button[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.note{font-size:12.5px;color:var(--muted);margin:0}
.bytes{font-family:var(--mono);font-size:12px;color:var(--muted)}
.confirm{border:1px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.confirm p{margin:0;font-size:14px}
.num-t{font-family:var(--mono);font-variant-numeric:tabular-nums}
.result{display:flex;flex-direction:column;gap:6px}
.res{display:flex;align-items:center;gap:8px;font-size:14px;padding:8px 10px;border-radius:9px}
.res.ok{background:var(--ok-soft);color:var(--ok)}
.res.bad{background:var(--bad-soft);color:var(--bad)}
.res.wait{background:var(--warn-soft);color:var(--warn)}
.res span{flex:1;min-width:0;word-break:break-all}
.toast{font-size:13px;color:var(--ok)}

.log ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.log li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.log li:first-child{border-top:0}
.log .when{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;align-self:start}
.chip.sent{background:var(--ok-soft);color:var(--ok)}
.chip.partial{background:var(--warn-soft);color:var(--warn)}
.chip.fail{background:var(--bad-soft);color:var(--bad)}
.empty{color:var(--muted);font-size:13px;margin:0}
.banner{font-size:13px;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn)}
@media (prefers-reduced-motion:no-preference){button{transition:filter .15s}button:hover:not(:disabled){filter:brightness(.96)}}

.smsrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:360px){.smsrow{grid-template-columns:1fr}}
.smsbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left}
.smsbtn small{font-weight:400;font-size:12px;opacity:.85}
.smsbtn.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
#lock{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;padding:16px;z-index:10}
#lock[hidden]{display:none}
#lock form{width:100%;max-width:320px;display:flex;flex-direction:column;gap:12px;text-align:center}
#lock h1{font-size:19px;margin:0}
#lock input{text-align:center;font-size:20px;letter-spacing:.3em;font-family:var(--mono)}
#lockErr{color:var(--bad);font-size:13px;margin:0}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>병원동행 배정 도우미</h1>
    <p>의뢰 문자 붙여넣기 → 교육센터 카톡 요청 → 매니저 정보 붙여넣기 → 고객·매니저 문자 동시 발송</p>
  </header>

  <!-- STEP 1 -->
  <section class="step" aria-labelledby="s1">
    <div class="step-h"><span class="num">1</span><h2 id="s1">고객 의뢰 문자</h2><span class="hint">붙여넣으면 자동 분리</span></div>
    <textarea id="rawReq" placeholder="고객이 보낸 신청 문자를 그대로 붙여넣으세요">왕복 / 8월 28일 오전 9시 / 부산 금정구 구서동 / OO병원 / 김영희 010-1234-5678</textarea>
    <p class="note" id="sampleNote">예시 문자가 들어 있어요. 실제 의뢰 문자로 바꿔 붙여넣으세요.</p>
    <div class="grid">
      <label>이용 형태<input id="f_type"></label>
      <label>일시<input id="f_when" placeholder="10월 6일(화) 오전 8시 30분"></label>
      <label>출발 지역<input id="f_area"></label>
      <label>방문 병원<input id="f_hosp"></label>
      <label>고객 성함<input id="f_name"></label>
      <label>고객 연락처<input id="f_phone" inputmode="tel"></label>
    </div>
  </section>

  <!-- STEP 2 -->
  <section class="step" aria-labelledby="s2">
    <div class="step-h"><span class="num">2</span><h2 id="s2">교육센터 카톡 요청</h2><span class="hint">고객 개인정보는 빠져요</span></div>
    <textarea id="kakaoMsg" class="msg" style="min-height:150px"></textarea>
    <div class="row">
      <button class="kakao grow" id="copyKakao" type="button">카톡 문구 복사</button>
    </div>
    <p class="toast" id="copyToast" hidden></p>
  </section>

  <!-- STEP 3 -->
  <section class="step" aria-labelledby="s3">
    <div class="step-h"><span class="num">3</span><h2 id="s3">배정 매니저 · 문자 보내기</h2></div>
    <textarea id="rawMgr" style="min-height:64px" placeholder="교육센터 답장을 붙여넣으세요 (예: 박OO 010-0000-0000)"></textarea>
    <div class="grid">
      <label>매니저 성함<input id="m_name"></label>
      <label>매니저 연락처<input id="m_phone" inputmode="tel"></label>
    </div>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab_c" aria-selected="true">고객용 문자</button>
      <button type="button" role="tab" id="tab_m" aria-selected="false">매니저용 문자</button>
    </div>
    <textarea id="msgCustomer" class="msg" aria-labelledby="tab_c"></textarea>
    <textarea id="msgManager" class="msg" aria-labelledby="tab_m" hidden></textarea>
    <div class="row" style="justify-content:space-between"><span class="bytes" id="bytes"></span><button type="button" id="resetMsgs" style="padding:6px 10px;font-size:12.5px;font-weight:500">문구 다시 만들기</button></div>
    <div class="result" id="result"></div>
    <div class="smsrow">
      <button class="primary smsbtn" id="smsC" type="button">고객에게 문자<small id="smsC_to">연락처 입력 필요</small></button>
      <button class="primary smsbtn" id="smsM" type="button">매니저에게 문자<small id="smsM_to">연락처 입력 필요</small></button>
    </div>
    <p class="note">누르면 휴대폰 문자 앱이 받는 사람과 내용이 채워진 채로 열려요. 전송만 누르세요.</p>
    <button type="button" id="newCase">다음 의뢰 시작</button>
  </section>
</div>
<div id="lock" hidden>
  <form id="lockForm">
    <h1>병원동행 배정 도우미</h1>
    <p class="note">관리자 비밀번호를 입력하세요.</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" aria-label="비밀번호">
    <button class="primary" type="submit">열기</button>
    <p id="lockErr" hidden>비밀번호가 맞지 않아요.</p>
  </form>
</div>
<script>
const SENDER = "01091364072";
const INQUIRY = "1688-9739";
const $ = id => document.getElementById(id);
const F = ["f_type","f_when","f_area","f_hosp","f_name","f_phone"];
let msgsEdited = {c:false,m:false,k:false};
let current = null; // {id, sent:{c,m}}

const PHONE_RE = /(01[016789])[\s.\-]?(\d{3,4})[\s.\-]?(\d{4})/;
const fmtPhone = s => { const m = String(s||"").match(PHONE_RE); return m ? `${m[1]}-${m[2]}-${m[3]}` : String(s||"").trim(); };
const digits = s => String(s||"").replace(/\D/g,"");
const DOW = ["일","월","화","수","목","금","토"];

function parseWhen(s){
  const dm = s.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/) || s.match(/(\d{1,2})\s*[\/.]\s*(\d{1,2})(?!\s*[:시])/);
  const tm = s.match(/(오전|오후|아침|저녁|낮)?\s*(\d{1,2})\s*시\s*(?:(\d{1,2})\s*분|(반))?/) || s.match(/(오전|오후)?\s*(\d{1,2}):(\d{2})/);
  if(!dm && !tm) return null;
  let out = "";
  if(dm){
    const mo = +dm[1], d = +dm[2], now = new Date();
    let y = now.getFullYear();
    const cand = new Date(y, mo-1, d);
    if(cand < new Date(now.getFullYear(), now.getMonth(), now.getDate()-30)) y++;
    const dt = new Date(y, mo-1, d);
    out = `${mo}월 ${d}일(${DOW[dt.getDay()]})`;
  }
  if(tm){
    let ap = tm[1]; let h = +tm[2]; const mi = tm[4] ? 30 : (tm[3] ? +tm[3] : 0);
    if(ap==="아침") ap="오전"; if(ap==="저녁"||ap==="낮") ap="오후";
    if(!ap){ if(h>12){ap="오후";h-=12;} else ap = (h>=7 && h<=11) ? "오전" : (h===12 ? "오후" : (h<7 ? "오후" : "오전")); }
    out += ` ${ap} ${h}시${mi ? ` ${mi}분` : ""}`;
  }
  return out.trim();
}

function parseRequest(text){
  const t = text.replace(/[📌📍✅■▶•]/gu," ").replace(/\r/g,"");
  const r = {type:"",when:"",area:"",hosp:"",name:"",phone:""};
  const pm = t.match(PHONE_RE); if(pm) r.phone = `${pm[1]}-${pm[2]}-${pm[3]}`;
  const parts = t.split(/[\/\n]/).map(s=>s.trim()).filter(Boolean);
  const used = new Set();
  const take = (i,key,val) => { r[key]=val; used.add(i); };
  parts.forEach((p,i)=>{
    if(!r.type && /(왕복|편도|갈\s*때|올\s*때|귀가|병원\s*안)/.test(p) && p.length<20) take(i,"type",p);
  });
  parts.forEach((p,i)=>{ if(used.has(i)) return; if(!r.when){ const w=parseWhen(p); if(w && /(월|일|시|:)/.test(p)) take(i,"when",w);} });
  parts.forEach((p,i)=>{ if(used.has(i)) return; if(!r.hosp && /(병원|의원|센터|클리닉|메디컬|한의원|치과|요양원)/.test(p)) take(i,"hosp",p); });
  parts.forEach((p,i)=>{ if(used.has(i)) return; if(!r.area && /(시|구|군|동|읍|면|리)(\s|$)/.test(p) && !PHONE_RE.test(p)) take(i,"area",p); });
  parts.forEach((p,i)=>{
    if(used.has(i) || r.name) return;
    const cleaned = p.replace(PHONE_RE,"").replace(/(성함|이름|연락처|신청자|보호자|님|:)/g," ").trim();
    const nm = cleaned.match(/[가-힣]{2,4}/);
    if(nm && (PHONE_RE.test(p) || i===parts.length-1 || i===parts.length-2)) take(i,"name",nm[0]);
  });
  return r;
}

function parseManager(text){
  const r = {name:"",phone:""};
  const pm = text.match(PHONE_RE); if(pm) r.phone = `${pm[1]}-${pm[2]}-${pm[3]}`;
  const cleaned = text.replace(PHONE_RE," ").replace(/(매니저|매니져|교육생|선생님|이름|성함|연락처|배정|입니다|이에요|예요|님|가능|전화|번호|:)/g," ");
  const nm = cleaned.match(/[가-힣]{2,4}/); if(nm) r.name = nm[0];
  return r;
}

const val = id => $(id).value.trim();
function info(){ return {type:val("f_type"),when:val("f_when"),area:val("f_area"),hosp:val("f_hosp"),name:val("f_name"),phone:fmtPhone(val("f_phone")),mname:val("m_name"),mphone:fmtPhone(val("m_phone"))}; }

function buildKakao(i){
  return `[병원동행 매니저 배정 요청]
■ 일시: ${i.when||"-"}
■ 이용: ${i.type||"-"}
■ 출발: ${i.area||"-"}
■ 병원: ${i.hosp||"-"}

가능한 교육생 1명 배정 부탁드립니다.
(이름 / 연락처 회신 부탁드려요)`;
}
function buildCustomer(i){
  return `[클라우드나인 메디케어]
${i.name||"고객"}님, 병원동행 매니저 배정이 완료되었습니다.

■ 일시: ${i.when}
■ 이용: ${i.type}
■ 병원: ${i.hosp}
■ 담당 매니저: ${i.mname||"(매니저)"} ${i.mphone||""}

이용 전날 담당 매니저가 먼저 연락드립니다.
문의: ${INQUIRY}`;
}
function buildManager(i){
  return `[클라우드나인 메디케어] 병원동행 배정 안내
${i.mname||"(매니저)"} 매니저님, 아래 일정이 배정되었습니다.

■ 일시: ${i.when}
■ 이용: ${i.type}
■ 출발: ${i.area}
■ 병원: ${i.hosp}
■ 고객: ${i.name} ${i.phone}

이용 전날 고객님께 확인 전화 부탁드립니다.`;
}

let refresh = function(){
  const i = info();
  if(!msgsEdited.k) $("kakaoMsg").value = buildKakao(i);
  if(!msgsEdited.c) $("msgCustomer").value = buildCustomer(i);
  if(!msgsEdited.m) $("msgManager").value = buildManager(i);
  F.forEach(id=>$(id).classList.toggle("missing", !val(id)));
  ["m_name","m_phone"].forEach(id=>$(id).classList.toggle("missing", !val(id)));
  updateBytes();
};
function byteLen(s){ let b=0; for(const ch of s){ b += ch.charCodeAt(0)>127 ? 2 : 1; } return b; }
function updateBytes(){
  const showC = !$("msgCustomer").hidden;
  const b = byteLen((showC?$("msgCustomer"):$("msgManager")).value);
  $("bytes").textContent = `${b} bytes · ${b>90?"장문(LMS)":"단문(SMS)"}`;
}

function applyRequest(){
  const r = parseRequest($("rawReq").value);
  $("f_type").value=r.type; $("f_when").value=r.when; $("f_area").value=r.area;
  $("f_hosp").value=r.hosp; $("f_name").value=r.name; $("f_phone").value=r.phone;
  msgsEdited = {c:false,m:false,k:false};
  refresh();
}
$("rawReq").addEventListener("input", ()=>{ $("sampleNote").hidden = true; applyRequest(); });
$("rawMgr").addEventListener("input", ()=>{ const r=parseManager($("rawMgr").value); $("m_name").value=r.name; $("m_phone").value=r.phone; msgsEdited.c=msgsEdited.m=false; refresh(); });
[...F,"m_name","m_phone"].forEach(id=>$(id).addEventListener("input", ()=>refresh()));
$("kakaoMsg").addEventListener("input", ()=>msgsEdited.k=true);
$("msgCustomer").addEventListener("input", ()=>{msgsEdited.c=true;updateBytes();});
$("msgManager").addEventListener("input", ()=>{msgsEdited.m=true;updateBytes();});
$("resetMsgs").addEventListener("click", ()=>{ msgsEdited={c:false,m:false,k:false}; refresh(); });

function selectTab(which){
  $("tab_c").setAttribute("aria-selected", which==="c"); $("tab_m").setAttribute("aria-selected", which==="m");
  $("msgCustomer").hidden = which!=="c"; $("msgManager").hidden = which!=="m"; updateBytes();
}
$("tab_c").onclick=()=>selectTab("c"); $("tab_m").onclick=()=>selectTab("m");

$("copyKakao").addEventListener("click", async ()=>{
  const ta = $("kakaoMsg"); const t = $("copyToast");
  try{ await navigator.clipboard.writeText(ta.value); t.textContent="복사했어요. 교육센터 카톡방에 붙여넣으세요."; }
  catch(e){ ta.focus(); ta.select(); t.textContent="문구를 선택해 두었어요. 길게 눌러 복사하세요."; }
  t.hidden=false; setTimeout(()=>t.hidden=true, 3500);
});

/* ---------- lock (이 기기에서 한 번 풀면 유지) ---------- */
const PIN_HASH = "3d236245b6c67615f1de65dcdccad805e1ac918288d8238de5d03cba66c523ce";
async function sha(s){ const b=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
(function(){
  let ok=false; try{ ok = localStorage.getItem("c9_assign_ok")===PIN_HASH; }catch(e){}
  if(!ok){ $("lock").hidden=false; setTimeout(()=>$("pin").focus(),50); }
  $("lockForm").addEventListener("submit", async ev=>{
    ev.preventDefault();
    if(await sha($("pin").value.trim())===PIN_HASH){ try{localStorage.setItem("c9_assign_ok",PIN_HASH);}catch(e){} $("lock").hidden=true; }
    else { $("lockErr").hidden=false; $("pin").select(); }
  });
})();

/* ---------- 휴대폰 문자 앱으로 보내기 ---------- */
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
function smsHref(to, body){ return `sms:${digits(to)}${isIOS?"&":"?"}body=${encodeURIComponent(body)}`; }
function updateSmsBtns(){
  const i=info();
  $("smsC_to").textContent = digits(i.phone).length>=10 ? `${i.name||"고객"} ${i.phone}` : "고객 연락처 입력 필요";
  $("smsM_to").textContent = digits(i.mphone).length>=10 ? `${i.mname||"매니저"} ${i.mphone}` : "매니저 연락처 입력 필요";
}
const _refresh = refresh; refresh = function(){ _refresh(); updateSmsBtns(); };
function openSms(kind){
  const i=info(); $("result").innerHTML="";
  const to = kind==="c" ? i.phone : i.mphone;
  const miss=[];
  if(digits(to).length<10) miss.push(kind==="c"?"고객 연락처":"매니저 연락처");
  if(!i.mname) miss.push("매니저 성함");
  if(!i.when) miss.push("일시");
  if(miss.length){ const d=document.createElement("div"); d.className="res bad"; const s=document.createElement("span"); s.textContent=`${miss.join(", ")}을(를) 채워주세요.`; d.appendChild(s); $("result").appendChild(d); return; }
  const body = (kind==="c"?$("msgCustomer"):$("msgManager")).value;
  const btn = $(kind==="c"?"smsC":"smsM"); btn.classList.add("done");
  window.location.href = smsHref(to, body);
}
$("smsC").addEventListener("click", ()=>openSms("c"));
$("smsM").addEventListener("click", ()=>{ selectTab("m"); openSms("m"); });

$("newCase").addEventListener("click", ()=>{
  $("rawReq").value=""; $("rawMgr").value=""; ["m_name","m_phone"].forEach(id=>$(id).value="");
  ["smsC","smsM"].forEach(id=>$(id).classList.remove("done"));
  applyRequest(); $("result").innerHTML=""; selectTab("c");
  window.scrollTo({top:0,behavior:"smooth"}); $("rawReq").focus();
});

applyRequest();
</script>
